[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falldet"
version = "0.1.0"
description = "Rule-based fall detection on RTMPose keypoints"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Pose front-end: RTMPose / RTMO via ONNX Runtime (Apache-2.0). No mmcv/mmdet.
    "rtmlib==0.0.15",
    # Tracking (Apache-2.0). Same choice as shoplifting-detection.
    "supervision>=0.26",
    "trackers>=2.5",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pyarrow>=17",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Pick exactly one runtime. Two venvs, one per extra (see README):
#   UV_PROJECT_ENVIRONMENT=.venv-gpu uv sync --extra gpu
#   UV_PROJECT_ENVIRONMENT=.venv-cpu uv sync --extra cpu
gpu = [
    # [cuda,cudnn] pulls the CUDA 12 / cuDNN 9 runtime wheels so onnxruntime's
    # CUDA EP can load without torch or a system CUDA install (see falldet.runtime).
    "onnxruntime-gpu[cuda,cudnn]>=1.23",
]
cpu = ["onnxruntime>=1.23"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
conflicts = [[{ extra = "gpu" }, { extra = "cpu" }]]
# rtmlib declares `onnxruntime` (CPU) and `opencv-contrib-python`. Both install into
# the same import package as onnxruntime-gpu / opencv-python, and whichever is
# installed last wins. In shoplifting-detection the CPU onnxruntime won, so the CUDA
# EP disappeared from get_available_providers(). The override rewrites every
# `onnxruntime` requirement (rtmlib's included) so it only applies with the `cpu`
# extra; opencv-contrib is never installed.
# onnxruntime dropped Intel-Mac wheels after 1.23.2, so cap it there only.
override-dependencies = [
    "onnxruntime>=1.23; extra == 'cpu' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "onnxruntime>=1.23,<1.24; extra == 'cpu' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-contrib-python; sys_platform == 'never'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]
